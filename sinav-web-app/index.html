<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E6A6E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ODAK</title>
    <script>
      // Tema titremesini önlemek için ilk boyamadan önce kayıtlı temayı uygula.
      try {
        var t = JSON.parse(localStorage.getItem('theme-storage') || '{}').state;
        if (t && (t.mode === 'light' || t.mode === 'dark')) document.documentElement.setAttribute('data-theme', t.mode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
