stages: [check, build]

default:
  image: node:24
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

lint:
  stage: check
  script: [npm run lint]

auth-config:
  stage: check
  script: [npm run validate-auth-config]

contract:
  stage: check
  script: [npm run tokens:build, npm run check:contract]

build:
  stage: build
  script: [npm run tokens:build, npm run build, npm run build:landing]
